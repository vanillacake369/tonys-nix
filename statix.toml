# repeated_keys is intentionally allowed: the dotted-key style
# (e.g. `oracle.enabled` + `oracle.healthChecks`) is idiomatic and readable,
# used deliberately across the agent/module configs.
#
# manual_inherit_from is style-only and currently false-positives on some
# generated provider attrsets that already use `inherit`; structural checks
# still come from deadnix, alejandra, and guard tests.
disabled = ["repeated_keys", "manual_inherit_from"]
