# NOTE:
# 이 TOML이 keybind 및 target 정책을 종합한 유일한 SSoT이다.
# 모든 workspace/monitor 이동, app rule, mode binding을 여기서 명시한다.
# to-*.nix는 키 표기 변환과 target 포맷 직렬화만 수행한다.

# =============================================================================
# AeroSpace
# =============================================================================

[aerospace.settings]
config_version = 2
start_at_login = true
enable_normalization_flatten_containers = false
enable_normalization_opposite_orientation_for_nested_containers = true
accordion_padding = 30
default_root_container_layout = "tiles"
default_root_container_orientation = "auto"
on_focused_monitor_changed = ["move-mouse monitor-lazy-center"]
automatically_unhide_macos_hidden_apps = false
persistent_workspaces = [
  "Docs",
  "Code",
  "Browser",
  "Terminal",
  "Music",
  "Schedule",
]

[aerospace.key_mapping]
preset = "qwerty"

[aerospace.gaps]
inner_horizontal = 9
inner_vertical = 9
outer_left = 9
outer_bottom = 9
outer_top = 9
outer_right = 9

[[aerospace.bindings]]
bind = "caps+cmd+h"
exec = "focus left"

[[aerospace.bindings]]
bind = "caps+cmd+j"
exec = "focus down"

[[aerospace.bindings]]
