[[aerospace.service_bindings]]
bind = "l"
exec = ["join-with right", "mode main"]

# =============================================================================
# Karabiner
# =============================================================================

[karabiner.caps]
trigger = "caps_lock"
to_modifiers = ["ctrl", "option"]
to_if_alone = ["escape", { select_input_source = "en" }]
description = "Capslock to Ctrl+Option / Esc + En when alone"

[karabiner.parameters]
simultaneous_threshold_milliseconds = 50
to_if_alone_timeout_milliseconds = 250
to_if_held_down_threshold_milliseconds = 500

[karabiner.contexts.browsers]
bundle_identifiers = ["^com\\.google\\.Chrome$", "^com\\.brave\\.Browser$"]

[karabiner.contexts.terminal_and_ide]
bundle_identifiers = [
  "^com\\.apple\\.Terminal$",
  "^com\\.googlecode\\.iterm2$",
  "^com\\.github\\.wez\\.wezterm$",
  "^io\\.alacritty$",
  "^net\\.kovidgoyal\\.kitty$",
  "^com\\.jetbrains\\..*$",
  "^com\\.knollsoft\\.Rectangle$",
]

[karabiner.contexts.korean_input]
type = "input_source_if"
input_sources = [
  { language = "ko" },
  { input_source_id = "^com\\.apple\\.inputmethod\\.Korean$" },
  { input_mode_id = "^com\\.apple\\.inputmethod\\.Korean\\..*$" },
]

[[karabiner.rules]]
bind = "shift+grave_accent_and_tilde"
to = "shift+option+grave_accent_and_tilde"
optional = ["any"]
condition = "korean_input"
description = "Force tilde when Korean input active"

[[karabiner.rules]]
bind = "grave_accent_and_tilde"
to = "option+grave_accent_and_tilde"
optional = ["any"]
condition = "korean_input"
description = "Force backtick when Korean input active"

[[karabiner.rules]]
bind = "right_command"
to = "f18"

