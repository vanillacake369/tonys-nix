name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: nix shell nixpkgs#just --command just check lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Guard tests
        run: nix shell nixpkgs#just --command just _test-guard

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux Home Manager targets
        shell: bash
        run: |
          nix eval --json .#homeConfigurations --apply builtins.attrNames \
            | jq -r '.[] | select(endswith("-x86_64-linux"))' \
            | while IFS= read -r target; do
                echo "Checking $target"
                nix build ".#homeConfigurations.${target}.activationPackage" --dry-run
              done
